<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Білім Порталы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDhGrRS_J1c3uQf-SUlsG2QuSjHRnwlPCU",
            authDomain: "aslan-4bc5c.firebaseapp.com",
            projectId: "aslan-4bc5c",
            storageBucket: "aslan-4bc5c.firebasestorage.app",
            messagingSenderId: "655221985403",
            appId: "1:655221985403:web:05aadfcbb48e5b19fb52de"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        window.handleAuth = async (type) => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('pass').value.trim();
            const loader = document.getElementById('loader');
            
            if (!email || !pass) { alert('Email мен парольді толтырыңыз'); return; }
            if (pass.length < 6) { alert('Пароль кемінде 6 таңба болуы керек'); return; }
            
            loader.classList.remove('hidden');
            loader.innerText = 'Орындалуда...';
            
            try {
                if (type === 'reg') {
                    await auth.createUserWithEmailAndPassword(email, pass);
                    alert('Тіркелдіңіз!');
                } else {
                    await auth.signInWithEmailAndPassword(email, pass);
                }
            } catch (e) {
                loader.classList.add('hidden');
                console.error(e);
                alert('Қате орын алды: ' + e.message);
            }
        };

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('main-section').classList.remove('hidden');
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('main-section').classList.add('hidden');
            }
            document.getElementById('loader').classList.add('hidden');
        });
    </script>
</head>
<body class="bg-gray-100">
    <div id="loader" class="hidden fixed inset-0 flex items-center justify-center bg-black/50 z-50 text-white text-xl font-bold">Орындалуда...</div>
    
    <div id="auth-section" class="flex items-center justify-center h-screen">
        <div class="bg-white p-8 rounded-xl shadow-md w-96">
            <h2 class="text-2xl font-bold mb-4">Білім Порталы</h2>
            <input type="email" id="email" placeholder="Email" class="w-full p-2 border mb-2 rounded">
            <input type="password" id="pass" placeholder="Пароль (6+ таңба)" class="w-full p-2 border mb-4 rounded">
            <button onclick="handleAuth('login')" class="w-full bg-blue-600 text-white p-2 rounded mb-2 hover:bg-blue-700 transition">Кіру</button>
            <button onclick="handleAuth('reg')" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-700 transition">Тіркелу</button>
        </div>
    </div>

    <div id="main-section" class="hidden p-8">
        <h1 class="text-3xl font-bold">Қош келдіңіз!</h1>
        <button onclick="auth.signOut()" class="bg-red-500 text-white px-4 py-2 mt-4 rounded hover:bg-red-600">Шығу</button>
    </div>
</body>
</html>
