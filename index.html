<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Білім Порталы - Олимпиада</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDhGrRS_J1c3uQf-SUlsG2QuSjHRnwlPCU",
            authDomain: "aslan-4bc5c.firebaseapp.com",
            projectId: "aslan-4bc5c",
            storageBucket: "aslan-4bc5c.firebasestorage.app",
            messagingSenderId: "655221985403",
            appId: "1:655221985403:web:05aadfcbb48e5b19fb52de"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const quizData = [
            { q: "Қазақстанның астанасы қай қала?", a: "Астана" },
            { q: "Пи саны нешеге тең?", a: "3.14" },
            { q: "Судың химиялық формуласы қандай?", a: "H2O" }
        ];

        window.handleAuth = async (type) => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            if (!email || !pass) return alert('Деректерді толтырыңыз');
            
            try {
                if (type === 'reg') await auth.createUserWithEmailAndPassword(email, pass);
                else await auth.signInWithEmailAndPassword(email, pass);
            } catch (e) { alert('Қате: ' + e.message); }
        };

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('main-section').classList.remove('hidden');
                renderQuiz();
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('main-section').classList.add('hidden');
            }
        });

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = quizData.map((item, i) => `
                <div class="mb-6 p-4 bg-gray-50 rounded-lg shadow">
                    <p class="font-bold text-lg">${i+1}. ${item.q}</p>
                    <input type="text" class="w-full mt-2 p-2 border rounded" placeholder="Жауабыңыз...">
                </div>
            `).join('');
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="auth-section" class="flex items-center justify-center h-screen">
        <div class="bg-white p-8 rounded-xl shadow-md w-96">
            <h2 class="text-2xl font-bold mb-4">Білім Порталы</h2>
            <input type="email" id="email" placeholder="Email" class="w-full p-2 border mb-2 rounded">
            <input type="password" id="pass" placeholder="Пароль" class="w-full p-2 border mb-4 rounded">
            <button onclick="handleAuth('login')" class="w-full bg-blue-600 text-white p-2 rounded mb-2">Кіру</button>
            <button onclick="handleAuth('reg')" class="w-full bg-green-600 text-white p-2 rounded">Тіркелу</button>
        </div>
    </div>

    <div id="main-section" class="hidden p-8 max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Олимпиада тапсырмалары</h1>
        <div id="quiz-container"></div>
        <button onclick="auth.signOut()" class="bg-red-500 text-white px-6 py-2 rounded mt-4">Шығу</button>
    </div>
</body>
</html>
