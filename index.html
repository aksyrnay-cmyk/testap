const norm = s => (s||'').toString().toLowerCase()
  .replace(/[«»"'.,!?;:()]/g,'')
  .replace(/ә/g,'а').replace(/і/g,'и').replace(/ң/g,'н').replace(/ғ/g,'г')
  .replace(/ү/g,'у').replace(/ұ/g,'у').replace(/қ/g,'к').replace(/ө/g,'о').replace(/һ/g,'х')
  .replace(/\s+/g,' ').trim();

const answerMatches = (given, correct) => {
  const g = norm(given), c = norm(correct);
  if(!g) return false;
  if(g===c) return true;
  // allow matching on the significant word for short-answer proper nouns
  if(c.length>3 && (g.includes(c) || c.includes(g))) return true;
  return false;
};

/* ============================= ЖАДЫ (STORAGE) КӨМЕКШІЛЕРІ ============================= */

async function sGet(key, shared=true){
  try{ const r = await window.storage.get(key, shared); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function sSet(key, value, shared=true){
  try{ await window.storage.set(key, JSON.stringify(value), shared); return true; }
  catch(e){ console.error('storage set error', e); return false; }
}
async function sListKeys(prefix, shared=true){
  try{ const r = await window.storage.list(prefix, shared); return r ? r.keys : []; }
  catch(e){ return []; }
}

function fmtTime(ms){
  if(ms<0) ms=0;
  const totalSec = Math.floor(ms/1000);
  const h = String(Math.floor(totalSec/3600)).padStart(2,'0');
  const m = String(Math.floor((totalSec%3600)/60)).padStart(2,'0');
  const s = String(totalSec%60).padStart(2,'0');
  return `${h}:${m}:${s}`;
}

function stageBadge(stage){
  if(stage==='completed') return `<span class="badge badge-done">Аяқталды</span>`;
  if(stage==='not_started') return `<span class="badge badge-wait">Басталмаған</span>`;
  return `<span class="badge badge-progress">Орындалуда</span>`;
}

/* ---- Олимпиада тапсырмасы ---- */

function renderOlympiad(progress){
  const el = document.getElementById('student-content');
  const stage = progress.stage || 'not_started';

  if(stage==='not_started'){
    el.innerHTML = `
      <div class="card p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="display text-2xl" style="color:var(--navy)">Олимпиада тапсырмасы</h2>
          ${stageBadge(stage)}
        </div>
        <p class="text-sm mb-3" style="color:#544f40">Тапсырма 2 бөліктен тұрады: алдымен <b>эссе</b> жазып тапсырасыз (${OLYMPIAD_ESSAY.durationMin/60} сағат уақыт беріледі), содан кейін <b>10 сұрақтан</b> тұратын тест тапсырасыз.</p>
        <div class="p-4 rounded mb-4" style="background:var(--paper)">
          <div class="eyebrow mb-1">Эссе тақырыбы</div>
          <div class="display text-lg mb-2" style="color:var(--navy)">${OLYMPIAD_ESSAY.title}</div>
          <ul class="text-sm space-y-1" style="color:#544f40">
            ${OLYMPIAD_ESSAY.guidelines.map(g=>`<li>— ${g}</li>`).join('')}
          </ul>
        </div>
        <button id="btn-start-olymp" class="btn btn-primary">Тапсырманы бастау</button>
      </div>`;
    document.getElementById('btn-start-olymp').onclick = async ()=>{
      progress.stage='essay';
      progress.essayStartedAt = Date.now();
      await sSet('progress:'+STATE.user.username, progress);
      renderOlympiad(progress);
    };
    return;
  }

  if(stage==='essay'){
    renderEssayStage(progress);
    return;
  }

  if(stage==='test'){
    renderOlympiadTestStage(progress);
    return;
  }

  if(stage==='completed'){
    renderOlympiadResults(progress);
    return;
  }
}

function renderEssayStage(progress){
  const el = document.getElementById('student-content');
  const deadline = progress.essayStartedAt + OLYMPIAD_ESSAY.durationMin*60*1000;

  el.innerHTML = `
    <div class="card p-6">
      <div class="flex items-center justify-between mb-3">
        <h2 class="display text-2xl" style="color:var(--navy)">Эссе: ${OLYMPIAD_ESSAY.title}</h2>
        <div class="timer" id="essay-timer">--:--:--</div>
      </div>
      <ul class="text-sm mb-3 space-y-1" style="color:#544f40">
        ${OLYMPIAD_ESSAY.guidelines.map(g=>`<li>— ${g}</li>`).join('')}
      </ul>
      <textarea id="essay-text" rows="12" placeholder="Эссеңізді осында жазыңыз...">${progress.essayDraft||''}</textarea>
      <div class="mt-3">
        <label class="text-xs font-semibold" style="color:#7a7563">Қосымша сурет тіркеу (міндетті емес)</label><br>
        <input type="file" id="essay-file" accept="image/*" class="mt-1 text-sm">
        <div id="file-preview" class="mt-2"></div>
      </div>
      <div class="flex items-center gap-3 mt-5">
        <button id="btn-submit-essay" class="btn btn-primary">Эссені тапсыру</button>
        <span class="text-xs" style="color:#a19c8a">Уақыт аяқталса, эссе автоматты түрде тапсырылады.</span>
      </div>
    </div>`;

  let attachedImage = progress.essay?.image || null;
  const preview = document.getElementById('file-preview');
  if(attachedImage){
    preview.innerHTML = `<img src="${attachedImage}" style="max-height:120px;border:1px solid var(--line);border-radius:4px">`;
  }

  document.getElementById('essay-file').onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 4*1024*1024){ alert('Сурет тым үлкен (4МБ дейін болу керек).'); return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      attachedImage = reader.result;
      preview.innerHTML = `<img src="${attachedImage}" style="max-height:120px;border:1px solid var(--line);border-radius:4px">`;
    };
    reader.readAsDataURL(file);
  };

  // autosave draft periodically
  const textarea = document.getElementById('essay-text');
  textarea.oninput = async ()=>{
    progress.essayDraft = textarea.value;
    await sSet('progress:'+STATE.user.username, progress);
  };

  async function doSubmit(auto){
    clearInterval(STATE.timerHandle);
    progress.essay = { text: textarea.value, image: attachedImage, submittedAt: Date.now(), auto: !!auto };
    progress.essayDraft = null;
    progress.stage = 'test';
    await sSet('progress:'+STATE.user.username, progress);
    renderOlympiad(progress);
  }

  document.getElementById('btn-submit-essay').onclick = ()=>doSubmit(false);

  function tick(){
    const remain = deadline - Date.now();
    const t = document.getElementById('essay-timer');
    if(!t) return;
    t.textContent = fmtTime(remain);
    if(remain < 10*60*1000) t.classList.add('low');
    if(remain<=0){ doSubmit(true); }
  }
  tick();
  STATE.timerHandle = setInterval(tick, 1000);
}

function renderOlympiadTestStage(progress){
  const el = document.getElementById('student-content');
  el.innerHTML = `
    <div class="card p-6">
      <h2 class="display text-2xl mb-1" style="color:var(--navy)">Олимпиада тест тапсырмасы</h2>
      <p class="text-sm mb-4" style="color:#7a7563">10 сұрақ. Жауабыңызды қысқаша жазыңыз.</p>
      <div id="olymp-q-list">
        ${OLYMPIAD_TEST.map((item,i)=>`
          <div class="qa-row py-3">
            <div class="text-sm mb-2"><span class="num">${i+1}.</span> ${item.q}</div>
            <input type="text" data-idx="${i}" class="olymp-answer" placeholder="Жауабыңыз...">
          </div>
        `).join('')}
      </div>
      <button id="btn-finish-olymp" class="btn btn-primary mt-4">Тестті аяқтау</button>
    </div>`;

  document.getElementById('btn-finish-olymp').onclick = async ()=>{
    const inputs = document.querySelectorAll('.olymp-answer');
    const answers = [];
    let score = 0;
    inputs.forEach(inp=>{
      const idx = +inp.dataset.idx;
      const given = inp.value;
      const ok = answerMatches(given, OLYMPIAD_TEST[idx].a);
      if(ok) score++;
      answers.push({given, correct: OLYMPIAD_TEST[idx].a, ok});
    });
    progress.test = { answers, score, total: OLYMPIAD_TEST.length, completedAt: Date.now() };
    progress.stage = 'completed';
    await sSet('progress:'+STATE.user.username, progress);
    renderOlympiad(progress);
  };
}

function renderOlympiadResults(progress){
  const el = document.getElementById('student-content');
  const t = progress.test;
  el.innerHTML = `
    <div class="card p-6 mb-5">
      <div class="flex items-center justify-between mb-2">
        <h2 class="display text-2xl" style="color:var(--navy)">Нәтиже</h2>
        ${stageBadge('completed')}
      </div>
      <div class="text-sm mb-4" style="color:#544f40">Тест бойынша ұпай: <b>${t.score} / ${t.total}</b></div>
      <div>
        ${t.answers.map((a,i)=>`
          <div class="qa-row py-2">
            <div class="text-sm mb-1"><span class="num">${i+1}.</span> ${OLYMPIAD_TEST[i].q}</div>
            <div class="text-sm">Сіздің жауабыңыз: <span style="color:${a.ok?'var(--green)':'var(--red)'}">${a.given||'—'}</span> ${a.ok?'✓':'✗'}</div>
            ${!a.ok?`<div class="text-sm" style="color:#7a7563">Дұрыс жауап: <b>${a.correct}</b></div>`:''}
          </div>
        `).join('')}
      </div>
    </div>
    <div class="card p-6">
      <div class="eyebrow mb-1">Тапсырылған эссе</div>
      <div class="display text-lg mb-2" style="color:var(--navy)">${OLYMPIAD_ESSAY.title}</div>
      <p class="text-sm whitespace-pre-wrap" style="color:#3a3626">${(progress.essay?.text||'').slice(0,3000)}</p>
      ${progress.essay?.image?`<img src="${progress.essay.image}" style="max-height:160px;border:1px solid var(--line);border-radius:4px;margin-top:10px">`:''}
    </div>
    <p class="text-xs mt-3" style="color:#a19c8a">Келесі кезең қолжетімді болғанда, мұғалім жариялайды. Прогресіңіз сақталды — қайта кіргенде осы нәтижелерді көресіз.</p>
  `;
}

/* ---- Тақырып бойынша тесттер ---- */

function renderTopics(progress){
  const el = document.getElementById('student-content');
  if(!STATE.activeTopic){
    el.innerHTML = `
      <div class="grid gap-4">
        ${TOPICS.map(topic=>{
          const sc = progress.topicScores?.[topic.id];
          return `
          <div class="card p-5 flex items-center justify-between">
            <div>
              <div class="display text-lg" style="color:var(--navy)">${topic.title}</div>
              <div class="text-xs mt-1" style="color:#a19c8a">${topic.questions.length} сұрақ ${sc?`• соңғы нәтиже: ${sc.score}/${sc.total}`:''}</div>
            </div>
            <button data-topic="${topic.id}" class="btn btn-ghost open-topic">Бастау</button>
          </div>`;
        }).join('')}
      </div>`;
    document.querySelectorAll('.open-topic').forEach(btn=>{
      btn.onclick = ()=>{ STATE.activeTopic = btn.dataset.topic; renderStudent(); };
    });
    return;
  }

  const topic = TOPICS.find(t=>t.id===STATE.activeTopic);
  el.innerHTML = `
    <div class="card p-6">
      <div class="flex items-center justify-between mb-1">
        <h2 class="display text-2xl" style="color:var(--navy)">${topic.title}</h2>
        <button id="btn-back-topics" class="btn btn-ghost">← Тізімге оралу</button>
      </div>
      <div id="topic-body" class="mt-4"></div>
    </div>`;
  document.getElementById('btn-back-topics').onclick = ()=>{ STATE.activeTopic=null; renderStudent(); };

  const body = document.getElementById('topic-body');
  body.innerHTML = `
    ${topic.questions.map((item,i)=>`
      <div class="qa-row py-3">
        <div class="text-sm mb-2"><span class="num">${i+1}.</span> ${item.q}</div>
        <input type="text" data-idx="${i}" class="topic-answer" placeholder="Жауабыңыз...">
      </div>
    `).join('')}
    <button id="btn-finish-topic" class="btn btn-primary mt-3">Тексеру</button>
    <div id="topic-result" class="mt-4"></div>
  `;
  document.getElementById('btn-finish-topic').onclick = async ()=>{
    const inputs = document.querySelectorAll('.topic-answer');
    let score = 0;
    const rows = [];
    inputs.forEach(inp=>{
      const idx = +inp.dataset.idx;
      const ok = answerMatches(inp.value, topic.questions[idx].a);
      if(ok) score++;
      rows.push({q:topic.questions[idx].q, given:inp.value, correct:topic.questions[idx].a, ok});
    });
    progress.topicScores = progress.topicScores || {};
    progress.topicScores[topic.id] = {score, total: topic.questions.length, completedAt: Date.now()};
    await sSet('progress:'+STATE.user.username, progress);

    document.getElementById('topic-result').innerHTML = `
      <div class="p-3 rounded mb-3" style="background:var(--paper)">Ұпай: <b>${score} / ${topic.questions.length}</b></div>
      ${rows.map((r,i)=>`
        <div class="qa-row py-2 text-sm">
          <div>${i+1}. ${r.q}</div>
          <div>Жауабыңыз: <span style="color:${r.ok?'var(--green)':'var(--red)'}">${r.given||'—'}</span> ${r.ok?'✓':'✗'}</div>
          ${!r.ok?`<div style="color:#7a7563">Дұрыс жауап: <b>${r.correct}</b></div>`:''}
        </div>`).join('')}
    `;
  };
}

/* ============================= МҰҒАЛІМ ЭКРАНЫ ============================= */

async function renderTeacher(){
  const users = await ensureSeed();
  const students = users.filter(u=>u.role==='student');
  const progressKeys = await sListKeys('progress:', true);

  root.innerHTML = `
    ${headerBar()}
    <div class="max-w-5xl mx-auto px-6 py-6">
      <h2 class="display text-2xl mb-4" style="color:var(--navy)">Оқушылар прогресі</h2>
      <div id="teacher-list" class="grid gap-4"></div>
    </div>
  `;
  document.getElementById('btn-logout').onclick = logout;
  const list = document.getElementById('teacher-list');

  if(students.length===0){
    list.innerHTML = `<div class="card p-6 text-sm" style="color:#7a7563">Әзірге тіркелген оқушы жоқ.</div>`;
    return;
  }

  for(const s of students){
    const key = 'progress:'+s.username;
    const p = progressKeys.includes(key) ? await sGet(key) : null;
    const stage = p?.stage || 'not_started';
    const testScore = p?.test ? `${p.test.score}/${p.test.total}` : '—';
    const topicSummary = p?.topicScores ? Object.entries(p.topicScores).map(([tid,v])=>{
      const t = TOPICS.find(x=>x.id===tid);
      return `${t?t.title.split('.')[0]:tid}: ${v.score}/${v.total}`;
    }).join(' • ') : '—';

    const card = document.createElement('div');
    card.className = 'card p-5';
    card.innerHTML = `
      <div class="flex items-center justify-between">
        <div>
          <div class="display text-lg" style="color:var(--navy)">${s.name}</div>
          <div class="text-xs" style="color:#a19c8a">@${s.username}</div>
        </div>
        <div class="flex items-center gap-3">
          ${stageBadge(stage)}
          <button class="btn btn-ghost btn-expand" data-u="${s.username}">Толығырақ</button>
        </div>
      </div>
      <div class="text-xs mt-2" style="color:#7a7563">Олимпиада тест ұпайы: <b>${testScore}</b> • Тақырып тесттері: ${topicSummary}</div>
      <div class="expand-body hidden mt-3 pt-3 border-t" style="border-color:var(--line)"></div>
    `;
    list.appendChild(card);

    card.querySelector('.btn-expand').onclick = ()=>{
      const body = card.querySelector('.expand-body');
      if(!body.classList.contains('hidden')){ body.classList.add('hidden'); return; }
      body.classList.remove('hidden');
      if(!p || !p.essay){
        body.innerHTML = `<div class="text-sm" style="color:#a19c8a">Эссе әлі тапсырылмаған.</div>`;
        return;
      }
      body.innerHTML = `
        <div class="eyebrow mb-1">Тапсырылған эссе</div>
        <p class="text-sm whitespace-pre-wrap mb-2" style="color:#3a3626">${p.essay.text||''}</p>
        ${p.essay.image?`<img src="${p.essay.image}" style="max-height:160px;border:1px solid var(--line);border-radius:4px">`:''}
        ${p.test?`<div class="mt-3">
          ${p.test.answers.map((a,i)=>`<div class="text-sm qa-row py-1">${i+1}. ${a.given||'—'} ${a.ok?'✓':'✗ (дұрысы: '+a.correct+')'}</div>`).join('')}
        </div>`:''}
      `;
    };
  }
}

/* ============================= ЖАЛПЫ РЕНДЕР / ШЫҒУ ============================= */

function logout(){
  clearInterval(STATE.timerHandle);
  STATE.user = null;
  STATE.view = 'auth';
  STATE.studentTab='olymp';
  STATE.activeTopic=null;
  render();
}

function render(){
  if(STATE.view==='auth') renderAuth();
  else if(STATE.view==='student') renderStudent();
  else if(STATE.view==='teacher') renderTeacher();
}

ensureSeed().then(render);
</script>
</body>
