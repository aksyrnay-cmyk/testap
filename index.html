<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Білім Порталы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDhGrRS_J1c3uQf-SUlsG2QuSjHRnwlPCU",
            authDomain: "aslan-4bc5c.firebaseapp.com",
            projectId: "aslan-4bc5c",
            storageBucket: "aslan-4bc5c.firebasestorage.app",
            messagingSenderId: "655221985403",
            appId: "1:655221985403:web:05aadfcbb48e5b19fb52de",
            measurementId: "G-70E4K0E9EC"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        window.handleAuth = async (type) => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            const loader = document.getElementById('loader');
            
            if (!email || !pass) { alert('Барлық жолдарды толтырыңыз'); return; }
            loader.classList.remove('hidden');
            
            try {
                if (type === 'reg') {
                    await auth.createUserWithEmailAndPassword(email, pass);
                    alert('Тіркелдіңіз!');
                } else {
                    await auth.signInWithEmailAndPassword(email, pass);
                }
            } catch (e) {
                alert('Қате: ' + e.message);
                loader.classList.add('hidden');
            }
        };

        firebase.auth().onAuthStateChanged((user) => {
            document.getElementById('loader').classList.add('hidden');
            if (user) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('main-section').classList.remove('hidden');
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('main-section').classList.add('hidden');
            }
        });
    </script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="loader" class="hidden fixed inset-0 flex items-center justify-center bg-black/50 z-50 text-white text-xl">Орындалуда...</div>
    
    <div id="auth-section" class="flex items-center justify-center h-screen">
        <div class="bg-white p-8 rounded-xl shadow-md w-96">
            <h2 class="text-2xl font-bold mb-4">Білім Порталы</h2>
            <input type="email" id="email" placeholder="Email" class="w-full p-2 border mb-2 rounded">
            <input type="password" id="pass" placeholder="Пароль" class="w-full p-2 border mb-4 rounded">
            <button onclick="handleAuth('login')" class="w-full bg-blue-600 text-white p-2 rounded mb-2 hover:bg-blue-700">Кіру</button>
            <button onclick="handleAuth('reg')" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-700">Тіркелу</button>
        </div>
    </div>

    <div id="main-section" class="hidden p-8">
        <h1 class="text-3xl font-bold">Қош келдіңіз!</h1>
        <button onclick="firebase.auth().signOut()" class="bg-red-500 text-white px-4 py-2 mt-4 rounded">Шығу</button>
    </div>
</body>
</html>
