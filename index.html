<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Қазақстан тарихы — мобильді нұсқа</title>
<style>
*{box-sizing:border-box}
:root{--dark:#101827;--blue:#2563eb;--bg:#f4f6fa;--line:#e4e8ef;--muted:#718096}
body{margin:0;background:var(--bg);color:#172033;font-family:Arial,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.top{background:linear-gradient(145deg,#101827,#24324a);color:#fff;padding:20px 16px 22px;border-radius:0 0 25px 25px}
.toprow{display:flex;align-items:center;gap:11px}
.logo{width:42px;height:42px;border-radius:13px;background:#315fd6;display:grid;place-items:center;font-size:21px}
.title{font-weight:750;font-size:18px}.small{font-size:11px;color:#cbd5e1;margin-top:2px}
.hero{margin-top:20px;font-size:25px;font-weight:750;line-height:1.15}
.tip{font-size:13px;color:#d6deeb;margin-top:7px;line-height:1.4}
.main{padding:0 12px 90px;max-width:650px;margin:auto}
.searchbox{position:sticky;top:8px;z-index:20;margin-top:-4px;padding:8px 0 5px}
.searchinner{background:#fff;border:1px solid #dfe4ec;border-radius:17px;box-shadow:0 7px 22px #00000012;display:flex;align-items:center;padding:5px}
.icon{width:42px;text-align:center;font-size:22px;color:#778195}
input{flex:1;min-width:0;height:50px;border:0;outline:0;font-size:17px;font-weight:650;background:transparent;color:#172033}
input::placeholder{font-weight:500;color:#8a94a5}
.clear{width:42px;height:42px;border:0;border-radius:12px;background:#f0f2f6;color:#707b8f;font-size:22px}
.status{font-size:12px;color:var(--muted);padding:8px 4px}
.results{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden}
.item{display:flex;gap:10px;padding:15px 13px;border-bottom:1px solid #edf0f4;min-height:64px;align-items:flex-start}
.item:last-child{border-bottom:0}
.item:active{background:#eef4ff}
.num{flex:0 0 29px;height:29px;border-radius:9px;background:#edf3ff;color:#2857c7;display:grid;place-items:center;font-size:11px;font-weight:750}
.itemtext{font-size:15px;line-height:1.45;font-weight:600;padding-top:3px}
.itemtext b{color:#1d4ed8;font-weight:800}
.empty{text-align:center;padding:32px 15px;color:var(--muted);font-size:14px}
.start{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px 17px}
.start h3{margin:0 0 7px;font-size:16px}.start p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.answer{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:0 8px 24px #0000000b}
.answerhead{background:#edf4ff;padding:19px 17px;border-bottom:1px solid #dce7fb}
.badge{display:inline-block;background:#dbeafe;color:#2454c6;padding:6px 9px;border-radius:99px;font-size:11px;font-weight:750}
.label{font-size:11px;color:#748096;text-transform:uppercase;letter-spacing:.5px;margin:17px 0 6px}
.question{font-size:17px;font-weight:750;line-height:1.5}
.answerbody{padding:17px}
.answertext{font-size:16px;line-height:1.7;background:#f8fafc;border:1px solid #edf0f4;border-radius:14px;padding:15px}
.back{width:100%;height:48px;margin-top:14px;border:0;border-radius:13px;background:var(--dark);color:#fff;font-size:15px;font-weight:650}
.footer{position:fixed;bottom:0;left:0;right:0;background:#ffffffeb;backdrop-filter:blur(10px);border-top:1px solid #e4e8ef;padding:10px 15px calc(10px + env(safe-area-inset-bottom));text-align:center;font-size:11px;color:#7b8495;z-index:30}
@media(min-width:700px){.main{padding-top:10px}.searchbox{position:relative;top:auto}.top{padding-left:max(16px,calc((100vw - 650px)/2));padding-right:max(16px,calc((100vw - 650px)/2))}}
</style>
</head>
<body>
<header class="top">
  <div class="toprow">
    <div class="logo">📜</div>
    <div><div class="title">Қазақстан тарихы</div><div class="small">Офлайн сұрақтар базасы</div></div>
  </div>
  <div class="hero">Сұрақты тез тап.</div>
  <div class="tip">Бір сөз, бірнеше әріп немесе толық сұрақ жазуға болады.</div>
</header>

<main class="main">
  <div class="searchbox">
    <div class="searchinner">
      <div class="icon">⌕</div>
      <input id="search" autocomplete="off" spellcheck="false" placeholder="Сұрақты жазыңыз...">
      <button id="clear" class="clear" aria-label="Тазалау">×</button>
    </div>
  </div>

  <div id="status" class="status">1287 сұрақ дайын</div>
  <div id="results" class="results" hidden></div>

  <section id="start" class="start">
    <h3>🔎 Қалай іздейді?</h3>
    <p><b>«Қазақ»</b> деп жазсаңыз — Қазақ сөзінен басталатын сұрақтар шығады. Сұрақты бассаңыз, жауабы ашылады.</p>
  </section>

  <div id="answer" hidden></div>
</main>

<div class="footer">🌐 Интернет қажет емес • 1287 сұрақ</div>

<script>
const questions = [{"question": "1903 ж. бекітілген ереже", "answer": "«Сырдария, Ферғана және Самарқан облыстарының қазыналық жерлеріне ерікті түрде қоныс аударту туралы»"}, {"question": "1904-1905 жж Ресейдің Торғай-Орал, Ақмола, Семей, Сырдария және Жетісу аудандарын құрудың негізгі мақсаты", "answer": "жаңа «артық» жерлерді анықтау"}, {"question": "1906 ж. шаруаларды Ресейдің азиялық бөлігіне жаппай қоныстандыру туралы шешім қабылдаған Ресей Министрлер Кеңесінің төрағасы", "answer": "П.А.Столыпин"}, {"question": "Шаруаларды Ресей империясының шығысына қоныстандыруды көздеген реформа", "answer": "Столыпиннің аграрлық реформасы"}, {"question": "Столыпин реформасының мақсаты", "answer": "шаруаларды Ресей империясының шығысына қоныстандыру"}, {"question": "Столыпин реформасының нәтижесінде Қазақстанға қоныстандырылған орыс және украин шаруалар саны", "answer": "700 мыңнан астам"}, {"question": "Столыпин реформасының мәні", "answer": "аграрлық"}, {"question": "Столыпин реформасы бойынша бір шаруашылыққа бөлініп берілген жайылым мен шалғындық алқаптың аумағы", "answer": "45 десятина"}, {"question": "Столыпин реформасы бойынша бір шаруашылыққа бөлініп берілген егістік жерінің аумағы", "answer": "15 десятина"}, {"question": "1903 ж.: «Далалық өлкеге қоныстанушы шаруаларды орналастыру барысында оларға шұрайлы жерлер, көбінесе қазақтардың қоныстанған қыстаулары бөлінетін... Қазақтарды жерінен айырып, қоныстарын тастап кетуге мәжбүрледік», - деп жазған", "answer": "В.К. Никольский"}, {"question": "1907 ж. II Мемлекеттік Думаға М.Тынышбаев сайланды", "answer": "Семей облысынан"}, {"question": "II Мемлекеттік Думаға Б Қаратаев сайланды", "answer": ""}, {"question": "ХХ ғ. басында қазақтардың жерге қатысты құқығын қорғаған башқұрт пен татар", "answer": ""}, {"question": "1904 ж. Сібір казак әскеріне «мәңгілік жекеменшікке» он шақырымдық алқап жер берілді", "answer": "Ертістің сол жағалауында"}, {"question": "XX ғ бас кезінде бір ғана Семей облысының өзінде жерсіз қалған қазақтар саны", "answer": "147 мыңға жуық"}, {"question": "«Қырғыздар (қазақтар) 30 жыл, әсіресе соңғы 12 жыл бойы барлық бағытта қысым көрді. 1904 жылдан бастап тек қана Жетісу облысынан бірнеше млн десятина жер тартып алынды», -деп жазған Түркістан өлкесінің генерал-губернаторы", "answer": "А.Н. Куропаткин"}, {"question": "1905-1907 жылдары болған оқиға", "answer": "Бірінші орыс революциясы"}, {"question": "Мәшһүр Жүсіп Көпейұлының 1905 ж.  9 қаңтарындағы оқиғаны айыптаған өлеңі", "answer": "«Қанды жексенбі»"}, {"question": "М.Ж.Көпейұлының «Қанды жексенбі» өлеңінің тақырыбы", "answer": "1905 – 1907 жж. революциясы"}, {"question": "Жергілікті тұрғындар тарапынан болуы мүмкін қарсылықтың алдын алу үшін 1906 ж. патша жарлығымен әскери жағдай енгізілген облыстар", "answer": "Ақмола, Семей"}, {"question": "Қазақ халқының өз құқықтарын қорғау жолындағы күресінің өзіндік ерекшелігінің бірі", "answer": "петициялар  жолдау"}, {"question": "Қазақ халқының Мемлекеттік Думадағы мүдделерін белсене қорғаған орыс депутаттары", "answer": "Т. Седельников, Н. Скалозубов"}, {"question": "«Жүздеген мың қыргыздар мүлде жерсіз қалып отыр, ұлтарақтай ғана болмашы жері бар қырғыздардың саны кем дегенде млнға жетеді»,- деп ашық айтқан Орынбор губерния-сынан сайланған депутат", "answer": "Седельников"}, {"question": "III Мемлекеттік Думаның мінберінен бүкіл мұсылман фракциясының атынан сөйлеген сөзінде Ресейдің ішкі аймағынан шаруаларды Қазақстанға жаппай қоныс аудартуды тоқтата тұруға шақырған закавказьелік депутат", "answer": "X. Мамедов"}, {"question": "II және IV Мемлекеттік Думалардағы мұсылман фракциясының құрамына кіріп, қазақтардың бастан кешіріп отырған ауыр халіне аудартқан қазақтың белгілі саяси қайраткерлерінің бірі", "answer": "М. Шоқай"}, {"question": "Семей облысынан I Мемлекеттік Думаға қазақтардан сайланды", "answer": "Әлихан Бөкейхан"}, {"question": "Ақмола облысынан I Мемлекеттік Думаға қазақтардан сайланды", "answer": "Шәймерден Қосшығұлұлы"}, {"question": "Торғай облысынан "}, {"question": "Ә.Бөкейханның  тарихи-этнографиялық  туындылары арасынан артығын табыңыз", "answer": "«Ішкі қырғыз ордасындағы саятшылық»"}, {"question": "Ә.Бөкейханның өмірі жайлы қате дәйекті анықтаңыз", "answer": "1950 ж. ақталды"}, {"question": "Кейінгі ұрпаққа жалпы көлемі 16 томнан тұратын мол ғылыми-публицистикалық мұра қалдырған қазақ ғалымы", "answer": "Ә. Бөкейхан"}, {"question": "«Ол елінің болашағы үшін қиыншылықтан қорықпайтын ұлтжанды азаматтарды күрескерлік рухта баулып, әдеби тіл нормасының орнығуы мен діни фанатизмнен арылуға зор үлес қосты», -деп Ә.Бөкейханға баға берген", "answer": "Қошке Кемеңгеров"}, {"question": "«Ол даладағы... қырғыздардың (қазақтардың) діни-саяси қозғалысының жетекшісі... үкіметке қарсы барлық митингілер мен үндеулер, петициялардың белсенді ұйымдастырушысы », - деп Омбы жандармдық басқармасы бастығы пікір білдірген", "answer": "Ә.Бөкейхан туралы"}, {"question": "Ә.Бөкейханның өміріне қатысты бұрыс дәйекті анықтаңыз", "answer": "1916 ж. ұлт азаттық көтерілісті қолдады"}, {"question": "Ә.Бөкейхан мақалалар жариялаған басылымдар арасынан артығын табыңыз", "answer": "«Ұшқын»"}, {"question": "Қарулы төңкеріс жасалып, Әскери-революциялық комитет Уақытша үкіметтің құлатылғанын жариялады 1919 ж. 3 қаңтарда 1918 ж. 14 наурызда 1917 ж. 25 қазанда 1919 ж. 18 ақпанда", "answer": ""}, {"question": "Қазан революциясы нәтижесінде билікке келген Халық Комиссарлары Кеңесі  үкіметін бақарды А.Керенский Н.Кротов В.И. Ульянов С.Ужгин", "answer": ""}, {"question": "Кеңестердің II Бүкілресейлік съезінде қабылданған Бітім туралы Декрет Білім туралы декрет Әскери жарғы Теңіз жарғысы", "answer": ""}, {"question": "Ақ гвардияшылармен күресте белсенділік танытқан Бөкей Ордасын қазақ атты әскер полкінің басшысы X. Чурин А.И. Дутов А.Керенский Н.Кротов", "answer": ""}, {"question": "Жергілікті халық арасында ақ гвардияшылармен күресте Қызыл Армия құрамына кіріп, әскер бөлімдерін құру  жұмыстарын жүргізді С. Арғыншиев", "answer": "Ш.Қосшығұлұлы"}, {"qu ер әрі ең кең таралған саяси және әдеби-ғылыми басылым", "answer": "«Қазақ»"}, {"question": "1988 ж. есімі ақталған қазақ элитасы көшбасшыларының бірі", "answer": "А. Байтұрсынұлы"}, {"question": "1921-1928 жж  Ташкенттегі Халыққа білім беру институтында қазақ тілі және әдебиеті, тарихы мен мәдениетінен дәріс оқыды", "answer": "Ахмет Байтұрсынұлы"}, {"question": "Бакуде өткен I түркология съезіне, Қазандағы халық ағарту қызметкерлерінің съезіне қатысып, білім беру жүйесін дамыту мөселелерін көтерді", "answer": "Ахмет Байтұрсынұлы"}, {"question": "1926 ж. жарыққа шыққан А.Байтұрсынұлының құнды еңбегі", "answer": "«Әдебиет танытқыш»"}, {"question": "А.Байтұрсынұлының әдебиет тарихы, теориясы мен методологиясы қарастырылып, қазақ әдебиеттану ғылымының негізі қаланған құнды еңбегі", "answer": "«Әдебиет танытқыш»"}, {"question": "Араб жазуы негізінде жасалған жаңа әліпбидің негізін қалаушы", "answer": "Ахмет Байтұрсынұлы"}, {"question": "Қазақ жерінде  араб әліпбиі латынға көшірілді", "answer": "1929 ж."}, {"question": "А. Байтұрсынұлының 1911 ж. жарық көрген «Маса» өлеңцер жинағындағы басты идея:", "answer": "Биліктің шектен шығуы мен зорлық-зомбылыгы"}, {"question": "А. Байтұрсынұлының 1929 ж. жалған айыппен қамауға алынып, өлім жазасына кесілу себебі", "answer": "Алаш қозғалысына қатысқаны үшін"}, {"question": "Ахмет Байтұрсынұлы атылды.", "answer": "1937 ж. желтоқсан"}, {"question": "1934. ж. бостандыққа шыққаннан кейін Ахмет Байтұрсынұлы отбасымен көшіп келген қала", "answer": "Алматыға"}, {"question": "Тіл білімі институты мен Қостанайдағы университетке есімі берілген қазақ халқының қайраткері", "answer": "Ахмет Байтұрсынұлы"}, {"question": "1923 ж. А. Байтұрсынұлы қағазға түсірген халық жыры", "answer": "«Ер Сайын»"}, {"question": "1926 ж. А.Байтұрсынұлы қағазға түсірген халық жыры", "answer": "«23 жоқтау»"}, {"question": "А.Байтұрсыновтың өлендер жинағы:", "answer": "«Маса»"}, {"question": "Қазақтың тұңғыш әліппесін жасаған және алғаш оқу құралының авторы", "answer": "Ахмет Байтұрсынов"}, {"question": "Ғылыми қызметті ұйымдастыру және жетілдіру үшін қазақ зиялылары Қазақстанды зерттеу қоғамына бірікті", "answer": "1920 ж."}, {"question": "1920-жж Қазақстанда пайда болған  алғашқы ғылыми-зерттеу мекемелері арасынан артығын табыңыз", "answer": "Ұлттық Қорғаныс университеті"}, {"question": "Қазақстан ғылымы дамуының тарихында 1932 ж. болған елеулі оқиға", "answer": "КСРО ҒА-ның қазақстандық базасы құрылды"}, {"question": "КСРО ҒА-ның қазақстандық базасының тұңғыш төрағасы болып тағайындалған академик, түркітанушы", "answer": "А.Н. Самойлович"}, {"question": "1935 ж. жарық көрген көне заманнан бүгінге дейінгі «Қазақстан тарихының» 1-бөлімін жазып шықты", "answer": "С.Асфендияров"}, {"question": "Ғылымға сіңірген еңбегі үшін геология-минералогия ғылымдарының докторы атағы алған  қазақ", "answer": "Қ. Сәтбаев"}, {"question": "1930 жж. қазақ тіл білімінің дамуында жетекші орын иеленген профессор", "answer": "Қ. Жұбанов"}, {"question": "Республикада тоталитарлық жүйе орнағаннан кейін А.Байтұрсынұлы, А. Самойлович, С. Асфендияров, Қ. Жұбанов ғылым қайраткерлері қуғын-сүргінге ұшырады", "answer": "30-жж"}, {"question": "1919-1925 жж. Халық ағарту институттары ашылған қалалар", "answer": "Орынбор,  Семей"}, {"question": "1919 ж. Халық Комиссарлары Кеңесі (ХКК) қол қойған декрет", "answer": "Қазақ байларын тәркілеу туралы"}, {"question": "1920 жж .қазақ өлкесін зерттеу қоғамының мүшелері арасынан артығын табыңыз", "answer": "В.В. Бартольд, В. Радлов"}, {"question": "Қазақстан тарихы қазақ тіліндегі мектеп оқулығын құрастырған профессор", "answer": "С.Асфендияров"}, {"question": "Алгебрадан қазақ тіліндегі мектеп оқулығын құрастырған ғалым", "answer": "Қ.И.Сәтбаев."}, {"question": "Географиядан қазақ тіліндегі мектеп оқулығын құрастырған ғалым", "answer": "Ә.Бөкейхан"}, {"question": "ҚазАКСР-де ауылға жаппай мәдени жорық ұйымдастыру жарияланды", "answer": "1924 ж."}, {"question": "«Сауатсыздық жойылсын» қоғамының қазақстандық филиалы құрылды", "answer": "1924 ж."}, {"question": "Түрксіб жұмысшылары үшін сауатсыздықты жою пункттері ашылды", "answer": "1927-1931 жж"}, {"question": "ҚазАКСР-де сауатсыздықты жою бойынша бағдарламаны насихаттаған  жалпыодақтық қоғам", "answer": "«Сауатсыздық жойылсын»"}, {"question": "Қазақстанның мемлекеттік көпшілік кітапханасы құрылды", "answer": "1931 ж"}, {"question": "1934 ж. ашылған С.М. Киров атындағы Қазақ мемлекеттік университетінің бүгінгі күнгі атауы", "answer": "Әл-Фараби атындағы Қазақ ұлттық университеті"}, {"question": "1928 ж. Кеңес билігінің халық арасындағы сауатсыздықты жою науқанының жағымды жақтарының  төмендеп қалу себебі", "answer": "латын жазуына көшу"}, {"question": "Қазақстандағы білім беру жүйесінің дамуындағы 1931 жылдың желтоқсан айында болған елеулі роқиға", "answer": "15-50 жас аралығындағы ересек адамдардың бәрін жаппай оқыту енгізілді."}, {"question": "Қазақ тілінде жазылған алғашқы оқулықтар авторларының бірі", "answer": "Ә. Ермеков"}, {"question": "1924 ж. араб әрпінің негізінде жасалған қазақ әліпбиін жетілдірді", "answer": "А. Байтұрсынұлы"}, {"question": "1928 ж. ҚазАКСР-де ашылған жоғары оқу орны", "answer": "Қазақ мемлекеттік педагогикалық институт"}, {"question": "1929 ж. ҚазАКСР-де ашылған жоғары оқу орны", "answer": "Алматы малдәрігерлік институты"}, {"question": "1930 ж. ҚазАКСР-де ашылған жоғары оқу орны", "answer": "Қазақ ауылшаруашылық институты"}, {"question": "1931 ж. ҚазАКСР-де ашылған жоғары оқу орны", "answer": "Алматы медицина институты"}, {"question": "1934 ж. ҚазАКСР-де ашылған жоғары оқу орны", "answer": "С.М. Киров атындағы Қазақ мемлекеттік университеті"}, {"question": "Хронологиялық реттілікпен орналастырыңыз 1) КСРО ҒА-ның Қазақстандық базасы құрылды. 2) 15-50 жас аралығындағы ересек адамдардың бәрін жаппай оқыту енгізілді. 3) ХКК сауатсыздықты жою туралы декретке қол қойылды. 4) Бастауыш оқытуды 8 жастан бастау туралы қаулы", "answer": "3.2.1.4"}, {"question": "Қазақ тілінде шыққан алғашқы оқулықтары авторлары қатарынан артығын табыңыз.", "answer": "М.Шаханов"}, {"question": "1938 ж жанынан аспирантура ашылған жоғары оқу орны", "answer": "ҚазМУ"}, {"question": "1928 ж. ҚазАКСР-де ашылған қазақ мемлекеттік педагогикалық институтына 1935 ж. берілген есім", "answer": "Абай"}, {"question": "1930 ж. 27 тамызда шыққан ОАК мен ХКК-нің қаулы", "answer": "Бастауыш оқытуды 8 жастан бастау туралы қаулы"}, {"question": "1899 ж 12 сәуірінде Қаныш Имантайұлы Сәтбаев туған жер", "answer": "Павлодар облысы Баянауыл ауданы"}, {"question": "1899-1964 жж. өмір сүрген академик", "answer": "Қ.Сәтбаев"}, {"question": "1909 ж. Қаныш Сәтбаев оқыған оқу орны", "answer": "Ақкелін ауылының мектебі"}, {"question": "1911-1914 жж.  Қаныш Сәтбаев оқыған оқу орны", "answer": "Павлодар орыс-қазақ мектебі"}, {"question": "1914 ж. Қаныш Сәтбаев оқуға түскен оқу орны", "answer": "Семей мұғалімдер семинариясы"}, {"question": "Қаныш Сәтбаев Семейде бірге оқыған қазақ зиялылары", "answer": "Ж. Аймауытов, М. Әуезов"}, {"question": "«Менің ұстаздардан әрқашан жолым болды, олар ықыласты, терең білімді зиялы қауым өкілдері еді. Жастық шағымдағы білімнің негізін қалаған осы кісілерге алғысым шексіз» деп жазды.", "answer": "Қ.Сәтбаев"}, {"question": "1920-1921 жж. Қ.Сәтбаев халық судьясы болып қызмет атқарды", "answer": "Баянауылда"}, {"question": "1921-1926 жж. Қ.И. Сәтбаев оқуған жоғары оқу орны", "answer": "Томск технологиялық институты"}, {"question": "Жас Қаныштың геолог болуына үлкен өсер етіп, туған елінің қазба байлықтарын зерттеуге ынталандырған ғалым", "answer": "М.А. Усов"}, {"question": "«Қ.И. Сәтбаев өзінің қажырлы еңбегімен Қазақстанның геологиялық мектебін қалыптастырды, геология ғылымының дамуына зор ықпал етті. Қазақтар арасында осындай жоғары деңгейге ешкім көтерілмеген еді», - деп атап көрсетті.", "answer": "Н.Ә. Назарбаев"}, {"question": "Қ.И.Сәтпаев Қазақ КСР ҒА-ның президенттігі қызметті атқарған кезінде даярлаған 50-ден астам ғылым кандидаттары мен докторлар қатарында болған белгілі ғалымдар", "answer": "Ш.Е. Есенов, Е.А. Букетов"}, {"question": "Ш. Уәлиханов жазып алған әйгілі Едіге батыр жайындағы «Ер Едіге» эпосын қазақ тіліне аударды", "answer": "Қ.Сәтбаев"}, {"question": "Қ.Сәтбаевтың Жезқазған-Ұлытау өңіріндегі этнографиялық мұраларды жинап, жазған еңбегі", "answer": "«Жезқазған ауданындағы көне заман ескерткіштері»"}, {"question": "1943 ж.: «Қазақстанның аса зор көлемдегі жер қойнауының пайдалы қазбалары Отан қорғау ісіне жұмсалды. Гитлерлік жауыздардың кеудесіне қадалған он оқтың тоғызы қазақстандық қорғасыннан құйылды. Танкілер мен өздігінен жүретін зеңбіректердің тең жартысы Қазақстанда балқытылған молибденмен қапталған. Снарядтар мен патрондар, әскердің байланыс жүйесіне қажетті құрылғылар Қазақстан жерінде дайындалды», — деп жазды.", "answer": "Қ.И. Сәтбаев"}, {"question": "Қазақ КСР Жоғаргы Кеңесі Президиумы Қ.Сәтбаевқа «Қазақ КСР-інің еңбек сіңірген ғылым қайраткері» атағын берді", "answer": "1944 ж."}, {"question": "1941-1964 жж. Қ.Сәтбаев басқарған жоғары оқу орны", "answer": "Геология институты"}, {"question": "Ұлы Отан соғысы жылдарында КСРО-да өндірілетін марганецтің 70,9 пайызы алынған кен", "answer": "Жезді кен орны"}, {"question": "Қ.И. Сәтбаев 2-дәрежелі Отан соғысы орденімен марапатталды", "answer": "Жезді марганец кен орнын ашқаны үшін"}, {"question": "1926 ж. Қазақ АКСР-і Халықшаруашылығы Орталық кеңесінің ұйғаруымен Қ.Сәтбаевқа жүктелген қызмет", "answer": "«Дорстройтрест» тресінің геология бөлімін басқару"}, {"question": "1935 ж. Қ.И. Сәтбаев Алтыншоқы жотасынан тапқан тас тақтайшаның ерекшелігі", "answer": "темір дәуірінің жазуы сақталған"}, {"question": "КСРО ҒА филиалының 1946 ж ҚазКСР Ғылым академиясы болып ашылуына зор еңбек сіңірген тұлға", "answer": "Қ.И. Сәтбаев"}, {"question": "Қ.И. Сәтбаев атымен аталған мекендер мен мекемелер арасынан артығын табыңыз", "answer": "Алматыдағы қазақ ұлттық университеті"}, {"question": "«Әкесінің ықпалымен Қаныш Имантайұлы бала кезінде араб, парсы тілін қызыға оқыды. Хафиз, Сағди, Науаи өлеңдерін жатқа жақсы білгені соншалық, демалыс күндері, әсіресе курорттағы демалыс  кездері ел алдында жатқа айтуды ұнататын. Әдеби шығармашылық  кештерді ұйымдастырып, өзі де қатысатын» , -деп жазды", "answer": "Ә.Марғұлан"}, {"question": "1935 ж. Қ.И. Сәтбаев Алтыншоқы жотасынан тапқан, темір дәуірінің жазуы сақталған тас тақтайша сақталып тұрған мұражай", "answer": "Эрмитаж"}, {"question": "Революцияға дейінгі бүкіл қазақ әдебиетіне тән белгілерді анықтаңыз І. қазақ ауылындағы таптық қарама-қайшылықтарды сынау ІІ. бүкіл қазақ халқының ортақ мүдделері мен ортақ мақсаттарын ІІІ. әйел адам басты кейіпкер ретінде қарастырылмады ІV. қалалық өмір сүреттелді", "answer": "І, ІІ"}, {"question": "Революцияға дейінгі қазақ әдебиетінің дем берушілері мен көсемдері", "answer": "А. Байтұрсынұлы, М. Дулатұлы"}, {"question": "Ақпан революциясы мен Қазақстанды кеңестендіру аралығында өзінің жоғарғы даму шегіне жеткен қазақ демократиялық әдебиетінің көрнекті өкілдері", "answer": "Ж. Аймауытов, Қ. Кемеңгеров, М. Жұмабаев"}, {"question": "1920-1930 жж өзгерістерді өздерінің шығармаларына арқау еткен жазушылар", "answer": "С.Сейфуллин, Б.Майлин, С.Мұқанов, Ғ.Мүсірепов"}, {"question": "1920-1930 жылдары қазақ әдебиетінің дамуына кері әсер еткен жағдайларды анықтаңыз І. бірқатар зиялы қауым өкілдері идеологиялық қысым көрді ІІ. бірқатар зиялы қауым Кеңес өкіметінің қолшоқпарына айналды ІІІ. жазушылар халыққа қарапайым тілмен революцияның маңызын жеткізуге тиісті болды ІV. кирилл әліпбиіне көшу өтті V. қазақ тілін әдебиет мен мәдениетте қолдануға тыйым салынды", "answer": "I, IІ, ІІІ"}, {"question": "Шығармашылығында кеңестік дәуірдің қарама-қайшылықтары реализм жанрында көрініс тапқан жазушылар", "answer": "М.Әуезов, М.Жұмабаев,  Ж.Аймауытов"}, {"question": "1920-жж әдеби қызметі үшін Кеңес өкіметіне қарсы қастандық жасаушы ретінде айыпталып, қуғын-сүргінге ұшыраған жазушы", "answer": "М. Жұмабаев"}, {"question": "1920-жж әдеби қызметі үшін Кеңес өкіметіне қарсы қастандық жасаушы ретінде айыпталып, қуғын-сүргінге ұшыраған жазушылар", "answer": "Ж. Аймауытов, О.Бөкей"}, {"question": "Жазушы мен оның шығармасын сәйкестендіріңіз", "answer": "1-А, 2-В, 3-С"}, {"question": "С.Дөнентаев", "answer": ""}, {"question": "М. Әуезов", "answer": ""}, {"question": "И.Байзақов А. «Қараш-Қараш оқиғасы», «Қилы заман», «Хан Кене» В. «Екібастұз», «Ерікті Айша», «Қазақ тіліне», «Көркемтай» С. «Құралай сұлу», «Қойшының ертегісі», «Неге Алатау шаттанды»", "answer": "1-А, 2-С, 3-В"}, {"question": "С. Сейфулиннің революционер бейнесін жасаған драмасы", "answer": "«Батырақ»"}, {"question": "1920-жылдардағы әдеби қызметі үшін Кеңес өкіметіне қарсы қастандық жасаушы ретінде айыпталып, қуғын-сүргінге ұшыраған жазушы", "answer": "Қ. Кемеңгеров"}, {"question": "1920-1930 жылдары кеңестік өмірді жырлаған Сәкен Сейфуллиннің тарихи мемуарлық романы", "answer": "«Тар жол, тайғақ кешу»"}, {"question": "1920-1930 жылдары кеңестік өмірді жырлаған Сәкен Сейфуллиннің өлеңдер жинағы", "answer": "«Асау тұлпар»"}, {"question": "1920-1930 жж  кеңестік өмірді жырлаған Сәкен Сейфуллиннің пьесалары", "answer": "«Бақыт жолында», «Қызыл сұңқарлар»"}, {"question": "1920-1930 жылдары кеңестік өмірді жырлаған  Сәкен Сейфуллиннің кітаптары", "answer": "«Альбатрос», «Қызыл ат»"}, {"question": "1930-жж. бас кезінде Қазақстанның ауылшаруашылығында болған асыра сілтеу оқиғалары сынға алынған Сәкен Сейфуллиннің кітабы", "answer": "«Қызыл ат»"}, {"question": "Қазақ халқының отаршылыққа қарсы күресі, өлкедегі Кеңес өкіметінің орнығу жолдары шыншылдықпен суреттелген Сәкен Сейфуллиннің романы", "answer": "«Тар жол, тайғақ кешу»"}, {"question": "Б.Майлиннің шығармалары арасынан артығын табыңыз", "answer": "«Ақбілек»"}, {"question": "М.Жұмабаевтың 1919-1923 жж жарыққа шыққан әйгілі поэмасы", "answer": "«Батыр Баян»"}, {"question": "XX ғғ басындағы әлеуметтік революциялар кезіндегі қазақ жасының өмірі суреттелетін Жүсіпбек Аймауытовтың романы", "answer": "«Қартқожа»"}, {"question": "«Ақбілек» романының а  const raw=input.value.trim(),q=norm(raw);
 answer.hidden=true;
 if(!q){results.hidden=true;start.hidden=false;status.textContent="1287 сұрақ дайын";return}
 start.hidden=true;
 const starts=[],contains=[];
 for(const x of questions){const nq=norm(x.question);if(nq.startsWith(q))starts.push(x);else if(nq.includes(q))contains.push(x)}
 const list=starts.concat(contains);
 if(!list.length){results.hidden=false;results.innerHTML='<div class="empty">🔎<br><br><b>Сұрақ табылмады</b><br><br>Басқа сөзбен немесе қысқаша жазып көріңіз.</div>';status.textContent="Нәтиже: 0";return}
 const shown=list.slice(0,50);
 results.hidden=false;
 results.innerHTML=shown.map((x,i)=>'<div class="item" data-i="'+i+'"><span class="num">'+(i+1)+'</span><span class="itemtext">'+hi(x.question,raw)+'</span></div>').join("");
 results.querySelectorAll(".item").forEach((el,i)=>el.onclick=()=>showAnswer(shown[i]));
 status.textContent="Табылды: "+list.length+(list.length>50?" • алғашқы 50 көрсетілді":"");
 const exact=questions.find(x=>norm(x.question)===q);
 if(exact)showAnswer(exact);
}
input.addEventListener("input",doSearch);
clear.onclick=()=>{input.value="";answer.hidden=true;results.hidden=true;start.hidden=false;status.textContent="1287 сұрақ дайын";input.focus()};
</script>
</body>
</html>
